<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Source for public/og.jpg, the 1200x630 link-preview image. To regenerate:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --screenshot=/tmp/og.png "file://$PWD/og/og.html"
    sips -s format jpeg -s formatOptions 88 /tmp/og.png --out public/og.jpg
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #0a0b10; color: #e9eaf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; gap: 64px; padding: 0 84px;
      position: relative;
    }
    body::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(#23273a 1px, transparent 1px),
        linear-gradient(90deg, #23273a 1px, transparent 1px);
      background-size: 44px 44px; opacity: 0.45;
      mask-image: radial-gradient(ellipse at 70% 40%, #000 0%, transparent 75%);
    }
    body::after {
      content: ""; position: absolute; width: 760px; height: 760px; right: -120px; top: -260px;
      background:
        radial-gradient(circle at 35% 45%, rgba(167, 139, 250, 0.30), transparent 55%),
        radial-gradient(circle at 65% 60%, rgba(94, 234, 212, 0.22), transparent 55%);
      filter: blur(24px);
    }
    img {
      position: relative; z-index: 1; flex: none;
      width: 330px; height: 400px; object-fit: cover; object-position: 50% 30%;
      border-radius: 40px; border: 1px solid #23273a;
      box-shadow: 0 0 0 6px rgba(167, 139, 250, 0.28), 0 30px 70px -20px rgba(94, 234, 212, 0.5);
    }
    .text { position: relative; z-index: 1; }
    .mono { font: 600 24px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #a78bfa; margin: 0 0 22px; }
    h1 { font-size: 72px; line-height: 1.02; letter-spacing: -0.03em; margin: 0 0 22px; }
    .gradient { background: linear-gradient(90deg, #a78bfa, #5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .role { font-size: 30px; color: #9a9db3; margin: 0 0 34px; }
    .url { font: 600 26px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #5eead4; margin: 0; }
  </style>
</head>
<body>
  <img src="../public/nate-avatar.jpg" alt="">
  <div class="text">
    <p class="mono">// Nate Arnold</p>
    <h1>I build software with <span class="gradient">agents and modern tooling</span>.</h1>
    <p class="role">Full stack and AI engineer · Kansas City, MO</p>
    <p class="url">natearnold.me</p>
  </div>
</body>
</html>
